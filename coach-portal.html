<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRONFORGE Coach Portal</title><style>body{margin:0;background:#09090b;color:#f4f4f5;font-family:system-ui}.wrap{max-width:1050px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between}.logo{color:#facc15;font-weight:900}.card{background:#18181b;border:1px solid #27272a;border-radius:16px;padding:18px;margin:15px 0}button{background:#facc15;border:0;border-radius:9px;padding:10px 15px;font-weight:800}.muted{color:#a1a1aa}</style></head><body><div class="wrap"><div class="top"><div><div class="logo">IRONFORGE INDIA</div><h1>Coach Portal</h1><div class="muted">Client sessions</div></div><button onclick="logout()">Log out</button></div><div class="card"><h2>Sessions</h2><div id="list">Loading...</div></div></div><script>async function api(p,o={}){let h={'Content-Type':'application/json'},t=sessionStorage.getItem('if_access');if(t)h.Authorization='Bearer '+t;let r=await fetch('/api'+p,{...o,headers:h});if(!r.ok){let x={};try{x=await r.json()}catch(e){}throw Error(x.detail||'Request failed')}return r.json()}async function load(){try{let me=await api('/me/');if(me.role!=='coach'){document.body.innerHTML='<div class="wrap"><h1>Coach access required</h1></div>';return}let x=await api('/sessions/'),a=x.results||x;document.getElementById('list').innerHTML=a.map(s=>'<div class="card"><b>'+ (s.topic||'Coaching session')+'</b><p>Client: '+(s.athlete_name||s.athlete)+'</p><p>'+new Date(s.scheduled_at).toLocaleString()+'</p><p>Status: '+s.status+'</p>'+(s.status==='scheduled'?'<button onclick="complete('+s.id+')">Mark Completed</button>':'')+'</div>').join('')||'<p class="muted">No sessions.</p>'}catch(e){document.getElementById('list').textContent=e.message}}async function complete(id){await api('/sessions/'+id+'/',{method:'PATCH',body:JSON.stringify({status:'completed'})});load()}function logout(){sessionStorage.clear();location.href='/'}load();</script></body></html>
